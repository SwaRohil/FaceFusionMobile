org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------------------------
# SwapStudio build switches
# ---------------------------------------------------------------------------------------------
# ONNX Runtime flavour that gets linked into the APK. The two official AARs cannot be combined
# (both ship libonnxruntime.so), so pick one:
#   qnn   -> com.microsoft.onnxruntime:onnxruntime-android-qnn  (CPU + Qualcomm QNN: Hexagon NPU
#            and Adreno GPU). arm64-v8a only. This is the right choice for the Galaxy S26 Ultra.
#   nnapi -> com.microsoft.onnxruntime:onnxruntime-android      (CPU + NNAPI + XNNPACK).
#            Works on every device and on x86_64 emulators.
swapstudio.ortRuntime=qnn

# Optional FFmpegKit bridge (stream-copy remux / container metadata through ffmpeg).
# FFmpegKit was retired by its maintainer and its artifacts were pulled from Maven Central, so it
# is NOT a default dependency. Point this at a local AAR (e.g. app/libs/ffmpeg-kit-full-6.0-2.aar)
# or at the Maven coordinates of a fork you trust to compile the bridge in. When empty, the app
# uses its built-in MediaExtractor/MediaMuxer path, which is also a lossless audio stream copy.
swapstudio.ffmpegKit=
